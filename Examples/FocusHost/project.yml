name: FocusHost
options:
  bundleIdPrefix: dev.mikolaj.swiftuitoasts
  deploymentTarget:
    tvOS: "18.0"
  createIntermediateGroups: true
packages:
  SwiftUIToasts:
    path: ../..
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
targets:
  FocusHost:
    type: application
    platform: tvOS
    sources:
      - FocusHost
    dependencies:
      - package: SwiftUIToasts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mikolaj.swiftuitoasts.focushost
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
  FocusHostUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources:
      - FocusHostUITests
    dependencies:
      - target: FocusHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mikolaj.swiftuitoasts.focushost.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: FocusHost
schemes:
  FocusHost:
    build:
      targets:
        FocusHost: all
        FocusHostUITests: [test]
    test:
      targets:
        - FocusHostUITests
